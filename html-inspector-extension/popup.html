<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Element Inspector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🔍 HTML Element Inspector</h1>
      <div class="header-controls">
        <button id="openWindowBtn" class="btn btn-secondary" title="Open in separate window">
          <span class="icon">🪟</span> Open in Window
        </button>
        <button id="refreshBtn" class="btn btn-primary" title="Refresh HTML">
          <span class="icon">🔄</span> Refresh
        </button>
        <button id="copyBtn" class="btn btn-success" title="Copy to clipboard">
          <span class="icon">📋</span> Copy HTML
        </button>
        <label class="toggle-switch">
          <input type="checkbox" id="autoUpdateToggle">
          <span class="toggle-slider"></span>
          <span class="toggle-label">Auto-update</span>
        </label>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="fullPage">Full Page HTML</button>
      <button class="tab-btn" data-tab="selectedElement">Selected Element</button>
    </div>

    <div class="tab-content">
      <div id="fullPageTab" class="tab-pane active">
        <div id="fullPageHtml" class="code-display"></div>
      </div>
      <div id="selectedElementTab" class="tab-pane">
        <div class="element-info">
          <div id="elementPath" class="element-path">No element selected. Use Alt+Click to select an element.</div>
        </div>
        <div id="selectedElementHtml" class="code-display"></div>
      </div>
    </div>

    <footer class="status-bar">
      <div class="status-item">
        <span class="status-label">Last Updated:</span>
        <span id="lastUpdate" class="status-value">Never</span>
      </div>
      <div class="status-item">
        <span class="status-label">Elements:</span>
        <span id="elementCount" class="status-value">0</span>
      </div>
      <div class="status-item">
        <span id="statusIndicator" class="status-indicator"></span>
      </div>
    </footer>
  </div>

  <div id="notification" class="notification hidden">
    <span id="notificationText"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
